<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- styles -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- main container start -->
    <div class="main-container">
      <!-- asidebar start -->
      <div class="aside">
        <div class="aside-logo">
          <i class="fa-solid fa-shop"></i>
          <div class="admin-panel">Admin panel</div>
        </div>

        <div class="aside-list-items">
          <div class="list-items">
             <!-- aside list items -->
            <ul>
              <li class="">
                <a href="#" class="active"><i class="fa-brands fa-trello"></i> Dashboard</a>
              </li>
              <li>
                <a href="#"
                  ><i class="fa-brands fa-product-hunt"></i> Products</a
                >
              </li>
              <li>
                <a href="#"><i class="fa-solid fa-cart-shopping"></i> Orders</a>
              </li>
              <li>
                <a href="#"><i class="fa-regular fa-user"></i> Customers</a>
              </li>
              <li>
                <a href="#"
                  ><i class="fa-solid fa-users-gear"></i> User Management</a
                >
              </li>
              <li>
                <a href="#"><i class="fa-solid fa-chart-line"></i> Analytics</a>
              </li>
              <li>
                <a href="#"><i class="fa-solid fa-cog"></i> Settings</a>
              </li>
            </ul>
          <!-- asie list item end -->
          </div>
          <!-- toggle -->
           <div class="theme-toggle">
            toggle-theme
           </div>
        </div>
      </div>
      <!-- asidebar end -->

      <div class="right-container">
        <!-- navbar starts -->
       <nav>
        <i id="hide" class="fa-solid fa-bars hide"></i>
        <div class="nav-items">
            <p>Welcome , Admin User</p>
            <a href="#" class="view-store">View Store</a>
            <div class="log-out">
              <a href=""><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
            </div>
        </div>
       </nav>
      <!-- navbar End -->
      <section>
        <div class="container">
          bashboard
        </div>
      </section>
      </div>

    </div>
    <!-- main container end -->

    <!-- javascript -->
    <script src="JS/app.js"></script>
  </body>
</html>
